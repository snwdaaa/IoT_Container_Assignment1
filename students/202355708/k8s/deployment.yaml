apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphics-lab
  labels:
    app: graphics-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: graphics-lab

  template:
    metadata:
      labels:
        app: graphics-lab

    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest

          command: ["nginx"]
          args: ["-g", "daemon off;"]

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          volumeMounts:
            - name: webpage
              mountPath: /opt/app-root/src
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: webpage
          configMap:
            name: graphics-lab-html